<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medifé - Calculadora de IMC</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #FFF5E6;
        }

        .container {
            background-color: #FFFFFF;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255,107,0,0.1);
            border: 1px solid #FF6B00;
        }

        h1 {
            color: #FF6B00;
            text-align: center;
            margin-bottom: 15px;
            font-size: 28px;
        }

        h2 {
            color: #8B4000;
            text-align: center;
            margin-bottom: 30px;
            font-size: 18px;
            font-weight: normal;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #8B4000;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #FF6B00;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #FF8C00;
        }

        button {
            background-color: #FF6B00;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #CC5600;
        }

        #resultado {
            margin-top: 25px;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
            font-size: 20px;
            display: none;
            border: 2px solid;
        }

        .normal { background-color: #FFE5CC; color: #8B4000; border-color: #FF6B00; }
        .bajo { background-color: #FFF3E6; color: #CC5600; border-color: #FF6B00; }
        .sobrepeso { background-color: #FFD8BF; color: #8B4000; border-color: #FF6B00; }
        .obesidad { background-color: #FFC4B3; color: #8B4000; border-color: #FF6B00; }
        
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo img {
            max-width: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <!-- Aquí puedes agregar el logo de Medifé -->
            <h1 style="color: #FF6B00; margin: 0;">MEDIFÉ</h1>
            <h2>Salud y bienestar</h2>
        </div>
        
        <h1>Calculadora de IMC</h1>
        
        <div class="input-group">
            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" step="0.1" placeholder="Ej: 68">
        </div>

        <div class="input-group">
            <label for="altura">Altura (cm):</label>
            <input type="number" id="altura" placeholder="Ej: 165">
        </div>

        <button onclick="calcularIMC()">CALCULAR ÍNDICE DE MASA CORPORAL</button>

        <div id="resultado"></div>
    </div>

    <script>
        // Mantener el mismo JavaScript de la versión anterior
        function calcularIMC() {
            const peso = parseFloat(document.getElementById('peso').value);
            const alturaCm = parseFloat(document.getElementById('altura').value);
            
            if (isNaN(peso) || isNaN(alturaCm) || peso <= 0 || alturaCm <= 0) {
                alert("Por favor ingrese valores válidos");
                return;
            }

            const alturaM = alturaCm / 100;
            const imc = peso / (alturaM * alturaM);
            
            let categoria = "";
            let claseCSS = "";
            
            if (imc < 18.5) {
                categoria = "Bajo peso";
                claseCSS = "bajo";
            } else if (imc < 25) {
                categoria = "Peso normal";
                claseCSS = "normal";
            } else if (imc < 30) {
                categoria = "Sobrepeso";
                claseCSS = "sobrepeso";
            } else {
                categoria = "Obesidad";
                claseCSS = "obesidad";
            }

            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = `
                <strong>IMC:</strong> ${imc.toFixed(2)}<br>
                <strong>Clasificación:</strong> ${categoria}
            `;
            resultadoDiv.className = claseCSS;
            resultadoDiv.style.display = 'block';
        }
    </script>
</body>
</html>
